# STARSTACK-ADDED: StarStack checks (FORK_CHANGES.md #33)
name: starstack-ci
on:
  push:
    branches: [dev, starstack]
  pull_request:
    branches: [dev, starstack]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # check_markers diffs against the upstream base commit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff==0.16.10
      - name: Lint (upstream KlipperScreen rules from pyproject.toml, check only)
        run: ruff check screen.py ks_includes panels tools/starstack
      - name: Formatting of StarStack files (upstream files are left as upstream ships them)
        run: ruff format --check ks_includes/starstack*.py panels/ss_*.py tools/starstack
      - name: STARSTACK-CHANGE markers balanced and documented
        run: python tools/starstack/check_markers.py
      - name: Cache theme sources
        uses: actions/cache@v4
        with:
          path: tools/starstack/.cache
          key: theme-sources-${{ hashFiles('tools/starstack/build_theme.py') }}
      - name: Theme is up to date with tools/starstack
        run: python tools/starstack/build_theme.py --check
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan (verified + unknown findings fail the build)
        uses: trufflesecurity/trufflehog@v3.82.13
        with:
          extra_args: --results=verified,unknown
